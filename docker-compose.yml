version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: college_club
      MYSQL_USER: clubapp
      MYSQL_PASSWORD: clubapppassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: college_club
      DB_USER: clubapp
      DB_PASSWORD: clubapppassword
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081/api
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mysql-data:
